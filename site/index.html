<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/mark.svg" />
    <title>blackboard — Agent 的外置记忆与可视化工作台</title>
    <meta name="description" content="blackboard 把 Agent 的判断、证据和当前位置记在项目本地。上下文压缩、断线或换会话之后，从同一份现场继续。" />
    <meta name="theme-color" content="#070a09" />
    <script>
      try {
        var t = localStorage.getItem('bb-site-theme') || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
