<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/mark.svg" />
    <title>Pinwhy — Agent 的外置记忆与可视化工作台</title>
    <meta name="description" content="Pinwhy 为 Agent 保存关键判断、证据与研究进展。跨会话读回项目记忆，在工作台里查看判断的依据与变化。本地优先，MIT 开源。" />
    <meta name="theme-color" content="#070a09" />
    <script>
      try {
        var t = localStorage.getItem('pinwhy-site-theme') || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
