# Apply this overlay after the installed dsh-pinwhy bundle.
# Paths below are placeholders; replace them with your own explicit project root.
# A row config is replaced, not deep-merged: restate all settings you need.
- id: pinwhy
  config:
    projects:
      - workspace: /absolute/path/to/your-project
        boardRoot: /absolute/path/to/your-project
